[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytest-lanes"
version = "0.1.0"
description = "Lane-based parallel test orchestration for pytest suites dominated by heavy infrastructure: database containers, service singletons, builds."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "HuzPro" }]
keywords = [
    "pytest",
    "plugin",
    "parallel",
    "orchestration",
    "testcontainers",
    "docker",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = ["pytest>=7.4"]

[project.optional-dependencies]
rich = ["rich>=13"]
test = ["rich>=13"]

[project.urls]
Homepage = "https://github.com/HuzPro/pytest-lanes"
Issues = "https://github.com/HuzPro/pytest-lanes/issues"
Changelog = "https://github.com/HuzPro/pytest-lanes/blob/main/CHANGELOG.md"

[project.entry-points.pytest11]
lanes = "pytest_lanes.plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_lanes"]
