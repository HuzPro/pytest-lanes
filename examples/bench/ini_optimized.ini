[pytest]
markers =
    db: simulated database-backed tests
    api: simulated daemon-backed tests
    unit: fast unit tests

[pytest-lanes]
lanes = db api unit
subprocess_order_standard = db unit api

[pytest-lanes:db]
marker = db
classifier_path_prefixes = db_tests/
subprocess_paths = db_tests
divisible = files

[pytest-lanes:api]
marker = api
classifier_path_prefixes = api_tests/
subprocess_paths = api_tests

[pytest-lanes:unit]
marker = unit
classifier_path_prefixes = unit_tests/
subprocess_paths = unit_tests
lane_numprocesses = 4
