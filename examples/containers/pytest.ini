[pytest]
pythonpath = .
markers =
	db: postgres-container-backed integration tests
	unit: fast unit tests

[pytest-lanes]
lanes = db other
subprocess_order_standard = db other

[pytest-lanes:db]
marker = db
classifier_path_prefixes = db_tests/
subprocess_paths = db_tests

[pytest-lanes:other]
marker = unit
classifier_fallback = true
subprocess_ignore_other_lanes = true
