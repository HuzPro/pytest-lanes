[pytest]
markers =
	slow_io: tests that simulate slow, environment-heavy infrastructure
	unit: fast unit tests

[pytest-lanes]
lanes = slow_io other
subprocess_order_standard = slow_io other

[pytest-lanes:slow_io]
marker = slow_io
classifier_path_prefixes = io_tests/
subprocess_paths = io_tests

[pytest-lanes:other]
marker = unit
classifier_fallback = true
subprocess_ignore_other_lanes = true
